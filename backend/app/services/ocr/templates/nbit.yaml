# Field layout of the certificate this project issues itself
# (see services/pdf_issue.py — keep the two in step).
#
# Two kinds of rule:
#   anchor + value: next_line  -> the label sits above its value, which is how
#                                 _draw_field() renders the boxed fields
#   pattern                    -> a regex whose first group is the value, for
#                                 values that share a line with other text
#
# `match` decides whether this template applies at all. An unmatched document
# yields no fields, which the verification engine turns into MANUAL_REVIEW —
# never a mismatch, because an unknown layout is not evidence of anything.

name: nbit
description: >
  Prototype degree certificate issued by this platform (A4 landscape,
  label-above-value fields, signed QR bottom-right).

match:
  # Every one of these must appear for the template to be considered a fit.
  all:
    - "DEGREE CERTIFICATE"
  # At least one of these as well, which rules out an unrelated page that
  # happens to carry the heading.
  any:
    - "Institution code"
    - "CERTIFICATE NUMBER"
    - "This is to certify that"

fields:
  cert_number:
    anchor: "CERTIFICATE NUMBER"
    value: next_line
    normalize: id

  roll_number:
    anchor: "ROLL NUMBER"
    value: next_line
    normalize: id

  # By pattern, not by anchor: the line after "DATE OF ISSUE" is the QR's
  # "Scan to verify" caption once OCR reflows the page, and the ISO date is
  # the only YYYY-MM-DD on the certificate anyway.
  issue_date:
    pattern: "([0-9]{4}-[0-9]{2}-[0-9]{2})"
    normalize: date

  student_name:
    anchor: "This is to certify that"
    value: next_line
    normalize: text

  programme:
    anchor: "has successfully completed the programme"
    value: next_line
    normalize: text

  institution_code:
    pattern: "Institution code\\s+([A-Za-z0-9]+)"
    normalize: id

  year_of_passing:
    pattern: "Year of passing\\s+([0-9]{4})"
    normalize: year

  # The grade line renders as either "CGPA 8.72 / 10.00" or "Marks 72.50%", so
  # exactly one of these two matches a given certificate. `\s*` not `\s+`:
  # OCR routinely reads the label and value as one word, "CGPA8.72".
  cgpa:
    pattern: "CGPA\\s*([0-9]{1,2}(?:[.,][0-9]{1,2})?)"
    normalize: decimal

  marks:
    pattern: "Marks\\s*([0-9]{1,3}(?:[.,][0-9]{1,2})?)\\s*%"
    normalize: decimal
